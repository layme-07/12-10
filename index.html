<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- SEMANA 1: Viewport para Mobile First -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberTech 2026 - Tecnología Gamer</title>
<!-- MÉTODO 1: CDN (requiere internet) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- SEMANA 3: Navbar colapsable con logotipo y botón hamburguesa -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold text-warning" href="#">⚡ CYBERTECH</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
            aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="#catalogo">Catálogo</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Encabezado con tipografías -->
<header class="bg-dark text-white text-center py-5">
  <div class="container">
    <h1 class="display-4 fw-bold text-uppercase text-warning">CyberTech 2026</h1>
    <p class="lead fst-italic mb-0">Componentes y periféricos gamer de última generación.</p>
  </div>
</header>

<!-- SEMANA 2: Catálogo en Grid (1 col móvil, 2 tablet, 3 desktop) -->
<main class="container py-5" id="catalogo">
  <div class="row g-4">

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card bg-dark text-white h-100 shadow">
        <div class="card-body text-center p-4">
          <span class="badge bg-warning text-dark text-uppercase mb-3">Nuevo</span>
          <div class="display-1 mb-2">💻</div>
          <h2 class="h5 fw-bold">Laptop Pro Gaming 16"</h2>
          <p class="display-6 fw-bold text-warning">$1,299</p>
          <button class="btn btn-warning fw-bold w-100">Añadir al Carrito</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card bg-dark text-white h-100 shadow">
        <div class="card-body text-center p-4">
          <span class="badge bg-danger text-uppercase mb-3">Oferta</span>
          <div class="display-1 mb-2">🖥️</div>
          <h2 class="h5 fw-bold">Monitor 240Hz 1ms</h2>
          <p class="display-6 fw-bold text-warning">$349</p>
          <button class="btn btn-warning fw-bold w-100">Añadir al Carrito</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-lg-4">
      <div class="card bg-dark text-white h-100 shadow">
        <div class="card-body text-center p-4">
          <span class="badge bg-success text-uppercase mb-3">Top</span>
          <div class="display-1 mb-2">⌨️</div>
          <h2 class="h5 fw-bold">Teclado Mecánico RGB</h2>
          <p class="display-6 fw-bold text-warning">$89</p>
          <button class="btn btn-warning fw-bold w-100">Añadir al Carrito</button>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- JavaScript desde CDN (necesario para la hamburguesa) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
